services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      AEGIS_ENVIRONMENT: ${AEGIS_ENVIRONMENT:-development}
      AEGIS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_API_HOST: 0.0.0.0
      AEGIS_API_PORT: "8000"
      AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-http://localhost:3000}
      AEGIS_OPERATOR_USERNAME: ${AEGIS_OPERATOR_USERNAME:-operator}
      AEGIS_OPERATOR_PASSWORD: ${AEGIS_OPERATOR_PASSWORD:-change-me-before-non-local-use}
      AEGIS_SESSION_COOKIE_NAME: ${AEGIS_SESSION_COOKIE_NAME:-aegis_session}
      AEGIS_SESSION_TTL_SECONDS: ${AEGIS_SESSION_TTL_SECONDS:-86400}
      AEGIS_SESSION_COOKIE_SECURE: ${AEGIS_SESSION_COOKIE_SECURE:-false}
      AEGIS_RESEARCH_BAR_LOAD_LIMIT: ${AEGIS_RESEARCH_BAR_LOAD_LIMIT:-252}
      AEGIS_DAILY_BAR_OUTPUT_SIZE: ${AEGIS_DAILY_BAR_OUTPUT_SIZE:-full}
      AEGIS_DAILY_BAR_PRIMARY_SOURCE: ${AEGIS_DAILY_BAR_PRIMARY_SOURCE:-alpha_vantage}
      AEGIS_DAILY_BAR_SECONDARY_SOURCE: ${AEGIS_DAILY_BAR_SECONDARY_SOURCE:-}
      AEGIS_ALPHA_VANTAGE_API_KEY: ${AEGIS_ALPHA_VANTAGE_API_KEY:-}
      AEGIS_POLYGON_API_KEY: ${AEGIS_POLYGON_API_KEY:-}
      AEGIS_EXCHANGE_CALENDAR_NAME: ${AEGIS_EXCHANGE_CALENDAR_NAME:-NYSE}
      AEGIS_MAX_LATEST_BAR_STALENESS_TRADING_DAYS: ${AEGIS_MAX_LATEST_BAR_STALENESS_TRADING_DAYS:-3}
    ports:
      - "${AEGIS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
