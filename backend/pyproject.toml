[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS 3.0 backend service (decision-support only; no order placement)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "pandas-market-calendars>=5.0,<6.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.7,<1.0",
  "pyright>=1.1.380,<2.0",
  "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/aegis --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection parameter defaults (Depends/Query/Path/...) are evaluated once
# by design and are not the "accidental mutable default" pattern B008 exists to catch.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Security",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
